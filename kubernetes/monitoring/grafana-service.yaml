apiVersion: v1
kind: Service
metadata:
  name: grafana-loadbalancer
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: LoadBalancer
  selector:                                         # same labels as the chart's own grafana service
    app.kubernetes.io/instance: prometheus-stack    # the helm release name
    app.kubernetes.io/name: grafana
  ports:
    - port: 3000          # opened on the local machine
      targetPort: 3000    # grafana's container port
